<!DOCTYPE html>
<html>
	
	<head>
		<title>Store procedures by issue widgets</title>
		
		<link rel="stylesheet" type="text/css" href="/assets/stylesheets/bootstrap.min.css" />
		<link rel="stylesheet" type="text/css" href="/assets/javascripts/jquery-handsontable/dist/jquery.handsontable.full.css" />
		<link rel="stylesheet" type="text/css" href="/assets/javascripts/jquery-handsontable/extensions/jquery.handsontable.bootstrap.css" />
		
		<script src="//ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>
		<script src="/assets/javascripts/jquery-handsontable/dist/jquery.handsontable.full.js"></script>
		<script src="/assets/javascripts/bootstrap.min.js"></script>
		<script src="/assets/javascripts/underscore-min.js"></script>

		<style>
			div.htAutocompleteArrow
			{
				display: none;
			}
		</style>

	</head>
	<body>
		
		<div id="storeprocedures" style="height: 250px; overflow: auto">&nbsp;</div>
		
		<script>
			var grid = null, 
				refreshPeriod = 10000,
				loadTimer = 0,
				source = null, 
				data = [], 
				newData = null,
				httpQueries = {},
				initialize = function(){},
				refresh = function(){},
				save = function(){};

			// Parsing parameters
			(window.onpopstate = function () {
			    var match,
			        pl     = /\+/g,  // Regex for replacing addition symbol with a space
			        search = /([^&=]+)=?([^&]*)/g,
			        decode = function (s) { return decodeURIComponent(s.replace(pl, " ")); },
			        query  = window.location.search.substring(1);
			
			    httpQueries = {};
			    while (match = search.exec(query))
			       httpQueries[decode(match[1])] = decode(match[2]);
			})();
				
			load = _.debounce(function() {
				
				stopPolling();
				
				$.ajax({url:"storeprocedure.json", async: false, success:function(result) {
					
					startPolling();
					
					if(!result.err) {
						var newSource = JSON.parse(result);
						
						// Same data
						if(_.isEqual(newSource, source)) {
							return;
						}
						
						source = newSource;
						if(newData == null) {
							data = newData = source.data;
						}
						else {
							newData = source.data;
						}
																	
						_.each(data, function(e, i, list) {
							
							if(e == null) return;
							
							var existedItem = _.find(newData, function(newDataItem){ return newDataItem.Id === e.Id;});
							if(existedItem) {
								// Update existed
								data[i] = existedItem;
							}
							else {
								if(e && !isNaN(e.Id + "")) {
									// Delete
									data[i] = null;
								}
							}
						});	
						
						// Insert new items
						_.each(newData, function(e, i, list) {
							
							if(e && e.Name === "") {
								return;
							}
							
							var existedItem = _.find(data, function(dataItem){ return dataItem && dataItem.Id === e.Id;});
							if(!existedItem) {
								if(!data[data.length - 1].Name) {
									data.splice(data.length - 1, 1, e);
								}
								else {
									data.push(e);
								}
							}
						});
						
						data = _.compact(data);
						
						if(data.length === 0) {

						}
						
						// Exist grid and at least one valid item in array
						if(grid && _.find(data, function(dataItem){ return dataItem && dataItem.Name != "" && dataItem.Name != null;})) {
							grid.data('handsontable').loadData(data);
						}
					}
			  	}});
			}, 50);
			
			function startPolling() {
				stopPolling();
				loadTimer = setInterval(load, refreshPeriod);
			};
			
			function stopPolling() {
				if(loadTimer !== 0) {
					clearInterval(loadTimer);
				}
				loadTimer = 0;
			};
		
			// Set object property by path
			_.mixin({
			  assign: function(obj, prop, value) {
				    if (typeof prop === "string") {
				        prop = prop.split(".");
				    }
				
				    if (prop.length > 1) {
				        var e = prop.shift();
				        obj[e] = _(Object.prototype.toString.call(obj[e]) === "[object Object]"
				                 ? obj[e]
				                 : {}).assign(prop, value);
				    } else {
				        obj[prop[0]] = value;
				    }
				    
				    return obj;
				}
			});
		
			// Filter for servers, databases, devs autocomplete
			function filterArray(array, q, p) {
				var regex = new RegExp(q, "i");
				var found = _.filter(array, function(e){

					return regex.test(e);
				});
				
				var limit = found.slice(0,9);
				if(found.length > 10) {
					limit.push("...");
				}
				p(limit);
			};
			
			function getLoginUser() {
				return httpQueries.author || "";
			}
			
			function del(e) {			
				
				var id = e.Id || 0;
				if(id == 0 || isNaN(id)){ 
					return;
				}
				
				$.ajax({
					url:"/storeprocedure/" + id, 
					async: true,
					method: "DELETE",
					success:function(result){
						startPolling();
			  		}
			  	});
			}
			
			function insert_or_update(e, index) {
				
				if(!e.Name) {
					return;
				}
			
				if(!e.ActionName) {
					return;
				}
			
				if(!e.StatusName) {
					return;
				}
			
				if(!e.Developer || !e.Developer.Username) {
					return;
				}			
				
				// Resolve id from name
				if(e.Server) {
					e.Server.Id = (_.find(source.servers, function(server){
						return server.name === e.Server.Name;
					}) || {}).id;
				}
				else {
					return;
				}
				
				if(e.Database) {
					e.Database.Id = (_.find(source.databases, function(database){
						return database.name === e.Database.Name;
					}) || {}).id;
				}
				else {
					return;
				}
				
				e.Status = (_.find(source.sp_statuses, function(status){
					return status.name === e.StatusName;
				}) || {}).id;
				
				if(e.Developer) {
					e.Developer.Id = (_.find(source.devs, function(dev){
						return dev.name === e.Developer.Username;
					}) || {}).id;
				}
				else {
					e.Developer = {};
				}
				
				var d = [
					'id=' + e.Id, 
					'serverId=' + e.Server.Id, 
					'databaseId=' + e.Database.Id, 
					'name=' + (e.Name || ""), 
					'isFunction=' + (e.IsFunction || false), 
					'actionName=' + (e.ActionName || ""),
					'modifiedBy=' + getLoginUser(),
					'status=' + e.Status,
					'description=' + (e.Description || ""),
					'issueId=' + source.issueId,
					'developerId=' + (e.Developer.Id || 0)
				];
				
				$.ajax({
					url:"/storeprocedure?" + d.join('&'), 
					async: true,
					method: "POST",
					success:function(result){
						if(!isNaN(result + "") && result != 0) { // Insert success
							if(data[index].Id  === 0) {
								e.Id = data[index].Id = parseInt(result);
							}				
						}
						else {
							notify(result);
						}
						
						startPolling();
			  		}
			  	});
			}
			
			function notify(msg) {
				console.log(msg);
			}
			
			// Modify newData object
			function onChange(change) {				
				stopPolling();
				
				_.each(change, function(e, index, list){
					// [row, binding, null, value]
					var change = jQuery.extend(true, {}, e);
					var insert = !data[e[0]];
					var row = _(data[e[0]] || {}).assign(e[1], e[3]);
					data[e[0]] = row;
					insert_or_update(data[e[0]], e[0]);									
				});
			}
		
			initialize = _.debounce(function(){
				grid = $("#storeprocedures").handsontable({
				  data: data,
				  startRows: 0,
				  minSpareRows: 1,
				  contextMenu: ['remove_row', "hsep3", "undo", "redo"],
				  manualColumnResize: true,
				  columnSorting: false,
				  persistentState: true,
				  scrollH: 'auto',
				  scrollV: 'auto',
				  colWidths: [110, 115, 230, 75, 65, 105, 100, 150, 120],
				  colHeaders: ["Server", "Database", "SP/Function", "Is Function", "Action", "Developer", "Status", "Description", "Modified by"],
				  columns: [
				    {
				      type: 'autocomplete',
				      source:  function(q, p) {
							filterArray(_.map(source.servers, function(e){ return e.name;}), q, p);
					  },
					  data: "Server.Name",
				      allowInvalid: false			      
				    },
				    {
				      type: 'autocomplete',
				      source:  function(q, p) {
							filterArray(_.map(source.databases, function(e){ return e.name;}), q, p);
					  },
					  data: "Database.Name",
				      allowInvalid: false
				    },
					{ 
						type: 'text',
						data: "Name"
					},
					{ 
						type: 'checkbox',
						data: "IsFunction"
					},
					{
						type: 'autocomplete',
						source: source.sp_actionTypes,
						data: "ActionName",
						strict: true,
						filter: false
					},
					{
						type: 'autocomplete',
				        source:  function(q, p) { 
							filterArray(_.map(source.devs, function(e){ return e.name;}), q, p);
					    },
					    data: "Developer.Username"
					},
					{
						type: 'autocomplete',
						source: _.map(source.sp_statuses, function(e){ return e.name;}),
						data: "StatusName",
						strict: true,
						filter: false
					},
					{ 
						type: 'text',
						data: "Description"					
					},
					{ 
						type: 'text', 
						data: "Modifier.Username",
						readOnly: true
					}    
				  ],
				  afterChange: function (change, source) {
					    if (source === 'loadData') {
					      return; //don't save this change
					    }
					    // Insert or update
					    onChange(change);
				  },
				  afterRemoveRow: function (index, amount) {
				  		var start = index;				  		
					  			
					  	stopPolling();
				  		while(start < amount + index) {
				  			if(newData.length > start) {
				  				del(newData[start]);
				  			}
				  			start++;
				  		}						
				  }
				});
				
				$('#storeprocedures table').addClass('table table-hover table-striped table-bordered');				
				
			}, 100);
			
			load();
			initialize();
			startPolling();
		</script>

	</body>
	
</html>
